# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deployment
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          # ▼ どちらか片方を使う
          # ダイジェスト固定の例（@sha256 を使う点が重要）：
          # image: asia-northeast1-docker.pkg.dev/sample-poc-468607/demo-repo/demo@sha256:d70079a88d77ca0b230da15640beca0d15c5a09f65237b3ffa09f9c57b8af338
          # タグ指定の例：
          image: asia-northeast1-docker.pkg.dev/sample-poc-468607/demo-repo/demo:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
